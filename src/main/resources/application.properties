# Nombre del proyecto
spring.application.name=kiosco

# Ruta donde se guardará el archivo de la base de datos en tu proyecto
spring.datasource.url=jdbc:sqlite:kiosco.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Indicamos a Hibernate qué dialecto usar para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Configuración del esquema (update crea o actualiza las tablas automáticamente según tus entidades)
spring.jpa.hibernate.ddl-auto=update

# Para ver las consultas SQL en la consola mientras programás (opcional pero muy útil)
spring.jpa.show-sql=true